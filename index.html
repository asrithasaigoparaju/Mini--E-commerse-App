<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Mini E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🛍️ ShopEase</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <button id="cartBtn" onclick="toggleCart()">
                🛒 Cart (<span id="cartCount">0</span>)
            </button>
        </nav>
    </header>

    <section class="hero" id="home">
        <h2>Welcome to ShopEase!</h2>
        <p>Discover amazing products at affordable prices.</p>
        <a href="#products" class="shop-btn">Shop Now</a>
    </section>

    <section class="products-section" id="products">
        <h2>Our Products</h2>
        <div class="products" id="productList"></div>
    </section>

    <section class="cart-section" id="cartSection">
        <h2>🛒 Your Shopping Cart</h2>

        <div id="cartItems"></div>

        <h3>Total: ₹<span id="totalPrice">0</span></h3>

        <button class="checkout-btn" onclick="openCheckout()">
            Proceed to Checkout
        </button>

        <button class="close-btn" onclick="toggleCart()">
            Close Cart
        </button>
    </section>

    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeCheckout()" aria-label="Close checkout">×</button>
            <h2>Order Summary</h2>
            <div id="checkoutItems"></div>
            <h3>Total Amount: ₹<span id="checkoutTotal">0</span></h3>

            <button class="confirm-btn" onclick="confirmOrder()">
                Confirm Order
            </button>

            <button class="close-btn" onclick="closeCheckout()">
                Cancel
            </button>
        </div>
    </div>

    <footer>
        <p>© 2026 ShopEase | Mini E-Commerce Project</p>
        <p>Developed using HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
